<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Gradiente radial de viñeta para contraste en Instagram -->
    <radialGradient id="insta-overlay" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#050a12" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#050a12" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#050a12" stop-opacity="0.85" />
    </radialGradient>

    <filter id="cyan-glow-sq" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Fondo Fotográfico: Sierras Reales de Tandil (Cuadrado 1:1) -->
  <g id="capa-fondo">
    <image href="fondo-sierras-1-1.jpg" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" />
    <rect width="1080" height="1080" fill="url(#insta-overlay)" />
  </g>

  <!-- 2. Resplandor Neón Central -->
  <g id="capa-resplandor" filter="url(#cyan-glow-sq)">
    <circle cx="540" cy="380" r="160" fill="#00e5ff" opacity="0.18" />
  </g>

  <!-- 3. Logotipo Oficial Tandil Labs HD -->
  <g id="capa-logotipo">
    <image href="logo-transparent-hd.png" x="340" y="160" width="400" height="400" />
  </g>

  <!-- 4. Textos Editables (Abrir en Figma, Illustrator, Inkscape o editor de texto) -->
  <g id="capa-textos" text-anchor="middle">
    <!-- Subtítulo -->
    <text id="txt-subtitulo" x="540" y="620" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="800" font-size="28" fill="#38bdf8" letter-spacing="1.5">
      SOFTWARE &amp; AUTOMATIZACIÓN
    </text>

    <!-- Detalle -->
    <text id="txt-detalle" x="540" y="665" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="500" font-size="20" fill="#f1f5f9" letter-spacing="0.5">
      Sistemas a Medida para Empresas
    </text>

    <!-- Web / Ubicación -->
    <text id="txt-web" x="540" y="705" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="600" font-size="16" fill="#a5f3fc" letter-spacing="1">
      Tandil, Buenos Aires &bull; tandillabs.pages.dev
    </text>
  </g>
</svg>
